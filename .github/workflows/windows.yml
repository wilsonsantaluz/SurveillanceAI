name: Windows desktop
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SurveillanceAI.sln
      - run: dotnet build SurveillanceAI.sln -c Release --no-restore
      - run: dotnet test SurveillanceAI.sln -c Release --no-build --logger trx
      - run: dotnet publish src/SurveillanceAI.Desktop -c Release -r win-x64 --self-contained true -o artifacts/publish
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: surveillanceai-win-x64
          path: artifacts/publish
